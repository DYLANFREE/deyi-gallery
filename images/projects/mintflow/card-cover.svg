<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">铸流 MintFlow 工具封面</title>
  <desc id="desc">将 USDT 与 USDC 的跨链供应变化和 BTC、ETH 的价格反应放在一起对照观察。</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2f6d52" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a87c" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#75aabd" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#ef916b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183d2c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#eef5f0"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <path d="M0 615 C190 560 320 660 505 600 C700 538 848 646 1020 578 C1126 536 1207 548 1280 568 L1280 720 L0 720 Z" fill="url(#river)"/>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="86" fill="#295f45" font-size="26" font-weight="700">MINTFLOW / 铸流</text>
    <text x="72" y="125" fill="#648075" font-size="20">跨链供应与价格反应的对照观察</text>

    <g filter="url(#shadow)">
      <rect x="72" y="185" width="318" height="340" rx="24" fill="#fbfdfb" stroke="#356c52" stroke-opacity="0.18"/>
      <text x="112" y="240" fill="#60776d" font-size="18">稳定币供应</text>

      <circle cx="160" cy="330" r="62" fill="#2f8558"/>
      <circle cx="160" cy="330" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="3"/>
      <text x="160" y="340" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">USDT</text>

      <circle cx="300" cy="330" r="62" fill="#4d87a8"/>
      <circle cx="300" cy="330" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="3"/>
      <text x="300" y="340" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">USDC</text>

      <path d="M112 447 H168 L190 421 L226 468 L258 438 L282 449 H350" fill="none" stroke="#3c7860" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="497" fill="#315d4a" font-size="22">跨链流通供应变化</text>
    </g>

    <g>
      <path d="M430 315 C493 315 501 278 552 278" fill="none" stroke="#4b806a" stroke-width="8" stroke-linecap="round"/>
      <path d="M430 395 C493 395 501 432 552 432" fill="none" stroke="#4b806a" stroke-width="8" stroke-linecap="round"/>
      <path d="M536 258 L568 278 L536 298" fill="none" stroke="#4b806a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M536 412 L568 432 L536 452" fill="none" stroke="#4b806a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="625" cy="355" r="76" fill="#f8fbf9" stroke="#2f6d52" stroke-opacity="0.22" stroke-width="2"/>
      <path d="M590 355 H660 M632 327 L660 355 L632 383 M618 327 L590 355 L618 383" fill="none" stroke="#cb623f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="625" y="471" fill="#60776d" font-size="20" text-anchor="middle">同步对照</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="806" y="185" width="402" height="340" rx="24" fill="#fbfdfb" stroke="#356c52" stroke-opacity="0.18"/>
      <text x="846" y="240" fill="#60776d" font-size="18">BTC / ETH 日度价格反应</text>

      <path d="M852 447 H1166 M852 395 H1166 M852 343 H1166 M852 291 H1166" stroke="#315d4a" stroke-opacity="0.1" stroke-width="2"/>
      <path d="M852 457 V284" stroke="#315d4a" stroke-opacity="0.22" stroke-width="2"/>
      <path d="M852 426 C890 415 910 421 942 387 C975 352 1004 376 1030 342 C1062 300 1091 335 1116 290 C1132 262 1150 274 1166 248" fill="none" stroke="#d16743" stroke-width="9" stroke-linecap="round"/>
      <path d="M852 451 C889 444 916 456 946 425 C979 392 1001 420 1034 393 C1070 363 1092 388 1122 354 C1144 330 1154 340 1166 318" fill="none" stroke="#4d87a8" stroke-width="8" stroke-linecap="round"/>

      <circle cx="1166" cy="248" r="8" fill="#d16743"/>
      <circle cx="1166" cy="318" r="8" fill="#4d87a8"/>
      <text x="1108" y="236" fill="#a74d31" font-size="20" font-weight="700">BTC</text>
      <text x="1108" y="351" fill="#3f708c" font-size="20" font-weight="700">ETH</text>
    </g>

    <rect x="476" y="570" width="328" height="58" rx="29" fill="#2c684d"/>
    <text x="640" y="608" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">看变化，不猜因果</text>
  </g>
</svg>
