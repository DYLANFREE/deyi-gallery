  <style>
    :root{color-scheme:light;--ink:#253a35;--muted:#64746b;--line:#d8dfd6;--paper:#f7f7f0;--accent:#a96830;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;line-height:1.7;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}
    .shell{width:min(1220px,calc(100% - 64px));margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:40px 0 27px}.eyebrow{font:10px/1.5 ui-monospace,monospace;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(28px,3.5vw,42px);font-weight:550;line-height:1.3;letter-spacing:-.03em;margin:12px 0 11px}.lead{color:var(--muted);margin:0}.snapshot{flex-shrink:0;text-align:right;font-size:11px;color:var(--muted)}
    .tabs{display:flex;gap:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:22px}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 22px;border-radius:4px}.tabs button[aria-selected=true]{background:#254638;color:#fff}.tabs button:hover:not([aria-selected=true]){background:#e8eddf}
    .document-wrap{border:1px solid var(--line);background:white;border-radius:6px;overflow:hidden}.document{display:block;width:100%;height:980px;border:0;background:#fff}

<body>
  <div class="shell">
    <header class="heading"><div><span class="eyebrow">BITCOIN / CYCLE OBSERVATORY</span><h1>比特币周期观察</h1><p class="lead">先看完整历史，再把四轮减半放回同一个起点。</p></div><span class="snapshot">日线截至 2026-10-06 · 按需更新</span></header>
    <nav class="tabs" role="tablist" aria-label="观察方式">
      <button id="tab-history" type="button" role="tab" aria-selected="true" aria-controls="panel-history" tabindex="0" data-panel="history">历史全景 · 2011 至今</button>
      <button id="tab-overview" type="button" role="tab" aria-selected="false" aria-controls="panel-overview" tabindex="-1" data-panel="overview">四轮周期</button>
    </nav>
    <section id="panel-history" role="tabpanel" aria-labelledby="tab-history">
      <div class="document-wrap"><iframe class="document" id="history-frame" title="历史全景：2011年至今" data-src="full-history.html"></iframe></div>
    </section>
    <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" hidden>
      <div class="document-wrap"><iframe class="document" id="cycles-frame" title="减半后，价格真的走同一条路吗？" data-src="four-cycles.html"></iframe></div>
    </section>
    <details class="basis"><summary>数据与更新</summary><p>两张图共用 Coin Metrics 的 BTC/USD 日线，按 UTC 收盘，价格截至 2026-10-06。历史全景中的 S2F 复算截至 2026-10-05，缺失日不补值。打开页面不会自动获取新行情。</p><p>四季只按减半后的时间划分，不按涨跌倒推，也不是牛熊预测。历史全景保留计算口径与来源；四轮周期下方可查看每轮的四季日期。</p></details>
  </div>
  <script>
    const tabs=[...document.querySelectorAll('[data-panel]')];
    // Old bookmarks now open the single, halving-aligned cycle view.
    function resolvePanel(id){return ['overview','model','seasons'].includes(id)?'overview':'history';}
    function selectPanel(requested,focus=false){
      const id=resolvePanel(requested);
      tabs.forEach(tab=>{const active=tab.dataset.panel===id;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;document.querySelector('#panel-'+tab.dataset.panel).hidden=!active;if(active&&focus)tab.focus();});
      const frame=document.querySelector('#panel-'+id+' iframe');
      if(!frame.getAttribute('src'))frame.src=frame.dataset.src;
      if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
    }
    tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>selectPanel(tab.dataset.panel));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();selectPanel(tabs[next].dataset.panel,true);});});
    const frames=[...document.querySelectorAll('.document')];
    window.addEventListener('message',event=>{
      const frame=frames.find(candidate=>candidate.contentWindow===event.source);
      if(!frame||!['btc-history-height','btc-cycles-height'].includes(event.data?.type))return;
      if(location.protocol!=='file:'&&event.origin!==location.origin)return;
      const height=Number(event.data.height);
      if(Number.isFinite(height)&&height>=300&&height<5000)frame.style.height=Math.ceil(height)+'px';
    });
    window.addEventListener('hashchange',()=>selectPanel(location.hash.slice(1)));
    selectPanel(location.hash.slice(1));
  </script>
